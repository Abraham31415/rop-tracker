services:
  - type: web
    name: rop-tracker-api
    runtime: python
    pythonVersion: "3.11.9"
    region: frankfurt
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: AT_USERNAME
        sync: false
      - key: AT_API_KEY
        sync: false
      - key: AT_SENDER_ID
        value: ROPTRACK
      - key: AT_SIMULATE
        value: "true"
      - key: WHATSAPP_API_URL
        value: ""
      - key: WHATSAPP_TOKEN
        value: ""
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
